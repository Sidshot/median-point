  <rect x="115" y="90" width="438" height="142" rx="24" fill="white" stroke="#D7E0EA" stroke-width="3"/>
  <text x="145" y="138" fill="#19324A" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">India's shipping problem</text>
  <text x="145" y="180" fill="#58738D" font-family="Inter, Arial, sans-serif" font-size="25">The crisis was not just about oil prices.</text>
  <text x="145" y="212" fill="#58738D" font-family="Inter, Arial, sans-serif" font-size="25">It was about whether cargoes could move safely at all.</text>

  <rect x="835" y="96" width="420" height="154" rx="24" fill="white" stroke="#D7E0EA" stroke-width="3"/>
  <text x="865" y="142" fill="#19324A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Operational adaptation</text>
  <text x="865" y="184" fill="#58738D" font-family="Inter, Arial, sans-serif" font-size="24">- Escorts arranged beyond the chokepoint</text>
  <text x="865" y="214" fill="#58738D" font-family="Inter, Arial, sans-serif" font-size="24">- Safer routing and reporting protocols</text>
  <text x="865" y="244" fill="#58738D" font-family="Inter, Arial, sans-serif" font-size="24">- Merchant protection as state strategy</text>

  <rect x="120" y="714" width="430" height="114" rx="20" fill="white" stroke="#D7E0EA" stroke-width="3"/>
  <text x="149" y="758" fill="#19324A" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Why it matters for the article</text>
  <text x="149" y="795" fill="#58738D" font-family="Inter, Arial, sans-serif" font-size="23">Energy security, naval protection, and diplomacy merged into a single operating problem.</text>
